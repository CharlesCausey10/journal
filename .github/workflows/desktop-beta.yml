name: Retry Windows packaging or build beta
on:
  push:
    tags: ['v*-beta.*']
    branches: [codex/tauri-beta]
    paths:
      - .github/workflows/desktop-beta.yml
      - scripts/windows-ci-webview-policy.ps1
permissions:
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        # Editing this workflow on the beta branch retries Windows packaging.
        # Version tags build both supported desktop installers.
        os: ${{ github.ref_type == 'tag' && fromJSON('["windows-latest","macos-15-intel"]') || fromJSON('["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}
      - name: Read release version
        shell: bash
        run: echo "BETA_TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint
      - run: npm exec tsc -- --noEmit
      - run: npm test -- --runInBand
      - run: npm run build:web
      - run: npm run test:native
      - run: npm run package -- ${{ runner.os == 'macOS' && '--target universal-apple-darwin --bundles app,dmg' || '--bundles nsis' }}
      - if: runner.os == 'Windows'
        run: node scripts/smoke-windows.cjs src-tauri/target/release/journal.exe
      - name: Check matching release draft before uploading from branch
        if: github.ref_type != 'tag'
        id: release-draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          is_draft=$(gh release view "$BETA_TAG" --json isDraft --jq .isDraft)
          echo "ready=$is_draft" >> "$GITHUB_OUTPUT"
      - name: Attach Windows installer
        if: runner.os == 'Windows' && (github.ref_type == 'tag' || steps.release-draft.outputs.ready == 'true')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$BETA_TAG" src-tauri/target/release/bundle/nsis/*.exe --clobber
      - name: Attach universal Mac installer
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$BETA_TAG" src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg --clobber
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Windows'
        with:
          name: beta-windows-startup-diagnostics
          path: |
            output/test-temp/windows-startup.json
            output/test-temp/first-launch/
            output/test-temp/reopen/
