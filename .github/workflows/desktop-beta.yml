name: Package desktop beta
on:
  push:
    tags: ['v*-beta.*']
permissions:
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: macos-15-intel
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}
      - run: npm ci
      - run: npm run lint
      - run: npm exec tsc -- --noEmit
      - run: npm test -- --runInBand
      - run: npm run build:web
      - run: npm run test:native
      - run: npm run package -- ${{ matrix.args }}
      - if: runner.os == 'Windows'
        run: node scripts/smoke-windows.cjs src-tauri/target/release/journal.exe
      - name: Attach Windows installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" src-tauri/target/release/bundle/nsis/*.exe --clobber
      - name: Attach universal Mac installer
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg --clobber
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Windows'
        with:
          name: beta-windows-startup-diagnostics
          path: |
            output/test-temp/windows-startup.json
            output/test-temp/first-launch/
            output/test-temp/reopen/
