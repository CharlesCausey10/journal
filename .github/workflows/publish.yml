name: Package Journal release
on:
  push:
    tags: ['v*', '!v*-*']
permissions:
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      max-parallel: ${{ vars.JOURNAL_UPDATER_PUBLIC_KEY != '' && 1 || 3 }}
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: macos-15-intel
            args: --target universal-apple-darwin --bundles app,dmg
          - os: ubuntu-24.04
            args: --bundles appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: npm ci
      - run: npm exec tsc -- --noEmit
      - run: npm test -- --runInBand
      - run: npm run build:web
      - run: npm run test:native
      - name: Build manual-install package
        if: vars.JOURNAL_UPDATER_PUBLIC_KEY == ''
        run: npm run package -- ${{ matrix.args }}
      - name: Verify Windows startup
        if: runner.os == 'Windows' && vars.JOURNAL_UPDATER_PUBLIC_KEY == ''
        run: node scripts/smoke-windows.cjs src-tauri/target/release/journal.exe
      - name: Attach manual-install package
        if: vars.JOURNAL_UPDATER_PUBLIC_KEY == ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$RUNNER_OS" in
            Windows) gh release upload "$GITHUB_REF_NAME" src-tauri/target/release/bundle/nsis/*.exe ;;
            macOS) gh release upload "$GITHUB_REF_NAME" src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg ;;
            Linux) gh release upload "$GITHUB_REF_NAME" src-tauri/target/release/bundle/appimage/*.AppImage ;;
          esac
      - name: Configure signed update artifacts
        if: vars.JOURNAL_UPDATER_PUBLIC_KEY != ''
        env:
          JOURNAL_UPDATER_PUBLIC_KEY: ${{ vars.JOURNAL_UPDATER_PUBLIC_KEY }}
        run: >
          node -e "const pubkey = process.env.JOURNAL_UPDATER_PUBLIC_KEY;
          if (!pubkey) throw Error('Set JOURNAL_UPDATER_PUBLIC_KEY for this release');
          require('fs').writeFileSync('src-tauri/release.conf.json', JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey}}}));"
      - uses: tauri-apps/tauri-action@v1
        if: vars.JOURNAL_UPDATER_PUBLIC_KEY != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOURNAL_UPDATER_PUBLIC_KEY: ${{ vars.JOURNAL_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Journal v__VERSION__
          releaseDraft: true
          args: ${{ matrix.args }} --config src-tauri/release.conf.json
